<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question for You 🌷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="petals" aria-hidden="true"></div>
  <main class="page">
    <div class="flower">🌸</div>
    <p class="eyebrow">A little something made just for you</p>
    <h1>Will you make my day special?</h1>
    <p class="intro">I have a question to ask… and I hope it makes you smile.</p>

    <section class="gallery" aria-label="Our memories">
      <img src="assets/images/a.jpg" alt="Memory 1">
      <img src="assets/images/b.jpg" alt="Memory 2">
      <img src="assets/images/c.jpg" alt="Memory 3">
      <img src="assets/images/d.jpg" alt="Memory 4">
      <img src="assets/images/e.jpg" alt="Memory 5">
      <img src="assets/images/f.jpg" alt="Memory 6">
      <img src="assets/images/g.jpg" alt="Memory 7">
    </section>

    <div class="question-card">
      <div class="tiny-flower">✿</div>
      <h2>Will you say yes?</h2>
      <p class="subtext">Whatever your answer, thank you for hearing me out.</p>
      <div class="actions">
        <button id="yesBtn" class="yes-btn">Yes 💗</button>
        <button id="noBtn" class="no-btn">No</button>
      </div>
      <p id="response" class="response" aria-live="polite"></p>
    </div>

    <button id="musicBtn" class="music-btn" type="button">♫ Play music</button>
    <audio id="bgMusic" src="assets/music/music.mp3" loop></audio>
    <footer>Made with care, flowers & a little courage 🌷</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
